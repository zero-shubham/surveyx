apiVersion: apps/v1
kind: Deployment
metadata:
  name: authsvc
  namespace: default
  labels:
    app: authsvc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authsvc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authsvc
    spec:
      containers:
        - name: authsvc
          image: localhost:32000/authsvc:registry
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@authsvc-db:5432/datab"
          ports:
            - containerPort: 8000

        - name: authsvc-db
          image: postgres:15
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: datab
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
              
      volumes:
        - name: db-data
          hostPath:
            path: /var/lib/pgdata
            type: DirectoryOrCreate