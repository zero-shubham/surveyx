apiVersion: apps/v1
kind: Deployment
metadata:
  name: surveysvc
  namespace: default
  labels:
    app: surveysvc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: surveysvc
      app.kubernetes.io/language: golang
  template:
    metadata:
      labels:
        app.kubernetes.io/name: surveysvc
        app.kubernetes.io/language: golang
    spec:
      containers:
        - name: surveysvc
          image: ghcr.io/zero-shubham/surveysvc:sha-a4f6a3e
          imagePullPolicy: Always
          env:
            - name: DATABASE_URL
              value: 'postgresql://postgres:postgres@surveysvc-db:30544/datab'
            - name: OLTP_HTTP_ENDPOINT
              value: 'localhost:4318'
          ports:
            - containerPort: 50052
              name: 'http-port'
          command: ['/main']

        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:latest
          args: ['--config=/etc/otelcol-contrib/config.yaml']
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otelcol-contrib/
          ports:
            - containerPort: 4318
          env:
            - name: OTEL_EXPORTER_OTLP_TRACES_TIMEOUT
              value: '10s'

      initContainers:
        - name: surveysvc-migrate
          image: ghcr.io/zero-shubham/surveysvc-migrate:sha-87d97cd
          env:
            - name: DATABASE_URL
              value: 'postgresql://postgres:postgres@surveysvc-db:30544/datab?sslmode=disable'
          args:
            ['-path', '/tmp', '-database', '$(DATABASE_URL)', '-verbose', 'up']

      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
