apiVersion: v1
kind: Service
metadata:
  name: apigw
spec:
  selector:
    app.kubernetes.io/name: apigw
  ports:
    - protocol: TCP
      targetPort: 8080
      port: 80
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: apigw-prom
spec:
  selector:
    app.kubernetes.io/name: apigw
  ports:
    - protocol: TCP
      port: 9464
      targetPort: 9464
      name: '9464'
  type: ClusterIP