apiVersion: v1
kind: ConfigMap
metadata:
  name: krakend-config
  labels:
    app: apigw
data:
  krakend.json: |
    {
      "version": 3,
       "plugin": {
        "pattern": ".so",
        "folder": "/etc/krakend/pb/"
      },
      "endpoints": [
        {
          "endpoint": "/v1/users/token/",
          "method": "POST",
          "backend": [
            {
              "host": [
                "localhost"
              ],
              "url_pattern": "/",
              "extra_config": {
                "plugin/http-client": {
                  "name": "krakend-client-example",
                  "krakend-client-example": {
                    "path": "/__debug/"
                  }
                }
              }
            }
          ]
        },
        {
          "endpoint": "/v1/organizations/",
          "extra_config": {
            "auth/validator": {
                "alg": "HS256",
                "audience": ["surveyx_api_gateway"],
                "scopes": ["*:*", "create:organizations"],
                "cache": false,
                "disable_jwk_security": true,
                "operation_debug": true,
                "jwk_local_path": "/etc/krakend/jwk/symmetric.json"
            }
        },
          "method": "POST",
          "input_query_strings": [
            "*"
          ],
          "input_headers": [
            "*"
          ],
          "backend":[
            {
              "host": ["http://orgsvc:8000"],
              "url_pattern": "/v1/organizations/",
              "method":"POST"
            }
          ]
        }
      ],
      "extra_config": {
        "router": {
            "return_error_msg": true
        },
        "auth/validator":{
          "operation_debug": true
        },
        "grpc-proxy": {
          "host": "authsvc:50050",
          "@comment": "The catalog loads all .pb files passed or contained in directories",
          "catalog": [
            "/etc/krakend/pb"
          ]
        },
        "telemetry/logging": {
          "level": "DEBUG",
          "prefix": "[KRAKEND]",
          "syslog": false,
          "stdout": true
        }
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: krakend-jwk
data:
  symmetric.json: |
    {
      "keys": [
        {
          "alg": "HS256",
          "kid": "MDNGMjU2M0U3RERFQUEwOUUzQUMwQ0NBN0Y1RUY0OEIxNTRDM0IxMw",
          "k": "YXNkZndlZmFzdmRmZzEyM3NkZmczNGFzZw==",
          "kty": "oct"
        }
      ]
    }