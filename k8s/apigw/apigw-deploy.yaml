apiVersion: apps/v1
kind: Deployment
metadata:
  name: apigw
  namespace: default
  labels:
    app: apigw
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: apigw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apigw
    spec:
      containers:
        - name: apigw
          image: krakend:2.9.4
          ports:
            - containerPort: 8080
          args: ['run', '-c', '/etc/krakend/krakend.json']
          env:
            - name: KAFKA_BROKERS
              value: 'surveysvc-broker:9092'
          volumeMounts:
            - name: krakend-config
              mountPath: /etc/krakend
            - name: krakend-jwk
              mountPath: /etc/krakend/jwk
            - name: krakend-plugin
              mountPath: /etc/krakend/plugin
      initContainers:
        - name: apigw-sleep
          image: busybox
          command: ['/bin/sh', '-c']
          args:
          - |
            HOST="surveysvc-broker"
            PORT="9092"
            SLEEP_TIME=5 # seconds

            echo "Pinging $HOST:$PORT until successful..."

            while true; do
                echo "Attempting to connect to $HOST:$PORT..."
                # Using -w 1 for a 1-second timeout for each nc attempt to prevent hanging
                nc -z -w 1 $HOST $PORT
                
                if [ $? -eq 0 ]; then
                    echo "Successfully connected to $HOST:$PORT!"
                    break # Exit the loop if connection succeeds
                else
                    echo "Connection to $HOST:$PORT failed. Retrying in $SLEEP_TIME seconds..."
                    sleep $SLEEP_TIME
                fi
            done
            echo "Init container finished, main application will start."

      volumes:
        - name: krakend-config
          configMap:
            name: krakend-config
        - name: krakend-jwk
          configMap:
            name: krakend-jwk
        - name: krakend-plugin
          hostPath:
            path: /home/zero/Documents/code/surveyx/surveyx-apigw/
            type: Directory
