apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orgsvc-db
  namespace: default
  labels:
    app: orgsvc-db
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orgsvc-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orgsvc-db
    spec:
      containers:
        - name: orgsvc-db
          image: postgres:15
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: datab
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          lifecycle:
            preStop:
              exec:
                command:
                  [
                    '/bin/sh',
                    '-c',
                    'pg_ctl -D /var/lib/orgsvc/pgdata -w -t 60 -m fast stop',
                  ]
      volumes:
        - name: db-data
          hostPath:
            path: /var/lib/orgsvc/pgdata
            type: DirectoryOrCreate
