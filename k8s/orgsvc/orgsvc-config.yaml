apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: orgsvc
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:

    exporters:
      otlp:
        endpoint: jaeger:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:9464

    # extensions:
    #   health_check:
    #   pprof:
    #   zpages:

    service:
      # extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp]
        # metrics:
        #   receivers: [otlp]
        #   processors: [batch]
        #   exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
