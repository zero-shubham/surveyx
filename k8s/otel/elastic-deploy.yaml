apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app: elasticsearch
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch

  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch

    spec:
      securityContext:
        fsGroup: 1000
      restartPolicy: Always
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
          env:
            - name: cluster.name
              value: 'jaeger-cluster'
            - name: discovery.type
              value: 'single-node'
            - name: ES_JAVA_OPTS
              value: '-Xms512m -Xmx512m'
            - name: xpack.security.enabled
              value: 'false'
          ports:
            - containerPort: 9200
            - containerPort: 9300
          volumeMounts:
            - name: esdata
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: esdata
          persistentVolumeClaim:
            claimName: elasticsearch-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  labels:
    db: elasticsearch
spec:
  storageClassName: vultr-block-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10G
