apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  labels:
    app: filebeat
data:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME} # Crucial: Pass NODE_NAME env var from DaemonSet
          hints.enabled: true # Enable hints for custom parsing via pod annotations

          # Default configuration for ALL containers discovered by Kubernetes autodiscover.
          # This applies if a pod does NOT have specific Filebeat annotations (hints).
          hints.default_config:
            type: container
            paths:
              - /var/log/containers/*-${data.kubernetes.container.id}.log
            processors:
              - decode_json_fields:
                  fields: ['message']
                  target: '' # Promote parsed JSON keys to the root of the event
                  overwrite_keys: true # Overwrite existing fields if names conflict
                  add_error_key: true # Add a field if JSON parsing fails, for debugging
                  
    # Output to Elasticsearch
    output.elasticsearch:
      hosts: ['elasticsearch:9200'] # Or your actual Elasticsearch service/IP/hostname
      # username: elastic # Uncomment and configure if security is enabled
      # password: your_elastic_password # Uncomment and configure if security is enabled

    # Setup for Kibana (index templates and dashboards)
    setup.kibana:
      host: 'kibana:5601' # Or your Kibana service/IP/hostname

    # General Filebeat settings
    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat.log
      keepfiles: 7
      permissions: 0644

