apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  labels:
    app: filebeat
data:
  filebeat.yml: |
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME} 
          hints.enabled: true 
          hints.default_config:
            type: container
            paths:
              - /var/log/containers/*-${data.kubernetes.container.id}.log
            parsers:
              - ndjson:
                  fields: ['log']
                  target: ''
                  overwrite_keys: true
            processors:
              - decode_json_fields:
                  fields: ['message']
                  target: '' 
                  overwrite_keys: true
                  add_error_key: true 
                  
    output.elasticsearch:
      hosts: ['elasticsearch:9200']

    setup.kibana:
      host: 'kibana:5601' # Or your Kibana service/IP/hostname

    # General Filebeat settings
    logging.level: info
    logging.to_files: true
    logging.files:
      path: /var/log/filebeat
      name: filebeat.log
      keepfiles: 7
      permissions: 0644
