apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s

    scrape_configs:
      - job_name: 'orgsvc-otel-collector'
        static_configs:
          - targets: ['orgsvc:9464']
      - job_name: 'authsvc-otel-collector'
        static_configs:
          - targets: ['authsvc:9464']