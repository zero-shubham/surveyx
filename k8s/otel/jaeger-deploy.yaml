apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: default
  labels:
    app: jaeger
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          env:
            - name: SPAN_STORAGE_TYPE
              value: elasticsearch
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
          args:
            - '--es.server-urls=http://elasticsearch:9200'
            - '--es.num-shards=1'
            - '--es.num-replicas=0'
            - '--log-level=error'

      initContainers:
        - name: jaeger-sleep
          image: busybox
          command: ['/bin/sh', '-c']
          args:
            - |
              HOST="elasticsearch"
              PORT="9200"
              SLEEP_TIME=5 # seconds

              echo "Pinging $HOST:$PORT until successful..."

              while true; do
                  echo "Attempting to connect to $HOST:$PORT..."
                  # Using -w 1 for a 1-second timeout for each nc attempt to prevent hanging
                  nc -z -w 1 $HOST $PORT
                  
                  if [ $? -eq 0 ]; then
                      echo "Successfully connected to $HOST:$PORT!"
                      break # Exit the loop if connection succeeds
                  else
                      echo "Connection to $HOST:$PORT failed. Retrying in $SLEEP_TIME seconds..."
                      sleep $SLEEP_TIME
                  fi
              done
              echo "Init container finished, main application will start."
