apiVersion: apps/v1
kind: Deployment
metadata:
  name: orgsvc
  namespace: default
  labels:
    app: orgsvc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: orgsvc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orgsvc
    spec:
      containers:
        - name: orgsvc
          image: localhost:32000/orgsvc:registry
          env:
            - name: DATABASE_URL
              value: 'postgresql+asyncpg://postgres:postgres@orgsvc-db:5432/datab'
          ports:
            - containerPort: 8000

        - name: orgsvc-db
          image: postgres:15
          env:
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: datab
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-data
        hostPath:
          path: /var/lib/pgdata
          type: DirectoryOrCreate
